name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: zephyr-sensor-node

      - name: Setup Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: zephyr-sensor-node
          toolchains: x86_64-zephyr-elf

      - name: Build app
        working-directory: zephyr-sensor-node
        run: west build -b native_sim app --pristine

      - name: Run unit tests
        working-directory: zephyr-sensor-node
        run: west twister -T tests -p native_sim -v --inline-logs
